name: CI/CD — Test, Build & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd src/client && npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

  build-and-deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    # Serialize deploys so two rapid pushes to master cannot land on the
    # server out of order. In-progress deploys are never cancelled.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd src/client && npm ci

      - name: Build server & client
        run: npm run build

      - name: Copy migration SQL files
        run: mkdir -p dist/server/database/migrations && cp src/server/database/migrations/*.sql dist/server/database/migrations/

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 147.5.127.99 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy server
        run: |
          tar czf /tmp/server-dist.tar.gz -C dist server
          scp /tmp/server-dist.tar.gz ubuntu@147.5.127.99:/tmp/
          ssh ubuntu@147.5.127.99 "sudo rm -rf /opt/pm-app/dist/server && sudo tar xzf /tmp/server-dist.tar.gz -C /opt/pm-app/dist && sudo ln -sf /opt/pm-app/migrations /opt/pm-app/dist/server/database/migrations && sudo chown -R ubuntu:ubuntu /opt/pm-app/dist && rm /tmp/server-dist.tar.gz"

      - name: Deploy client
        run: |
          tar czf /tmp/client-dist.tar.gz -C src/client/dist .
          scp /tmp/client-dist.tar.gz ubuntu@147.5.127.99:/tmp/
          ssh ubuntu@147.5.127.99 "sudo rm -rf /opt/pm-app/client-dist/assets && sudo tar xzf /tmp/client-dist.tar.gz -C /opt/pm-app/client-dist && sudo chown -R www-data:www-data /opt/pm-app/client-dist && rm /tmp/client-dist.tar.gz"

      - name: Restart & verify
        run: |
          ssh ubuntu@147.5.127.99 "sudo systemctl restart pm-app"

          # The verification script runs on the server via stdin. The heredoc
          # delimiter is quoted so nothing below is expanded on the runner;
          # every $variable is evaluated on the remote host.
          ssh ubuntu@147.5.127.99 'bash -s' <<'REMOTE'
          set -euo pipefail

          HEALTH_URL="http://127.0.0.1:3001/health"
          MAX_ATTEMPTS=20   # 20 attempts x 3s = up to ~60s
          INTERVAL=3

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            state="$(sudo systemctl is-active pm-app || true)"

            if [ "$state" = "failed" ]; then
              echo "::error::pm-app entered 'failed' state after restart"
              break
            fi

            if [ "$state" = "active" ]; then
              # No pipe here: curl's exit status is what decides success.
              if body="$(curl -sf --max-time 5 "$HEALTH_URL")"; then
                echo "pm-app is active and healthy after ${attempt} attempt(s)"
                echo "Health response: ${body:0:200}"
                exit 0
              fi
              echo "Attempt ${attempt}/${MAX_ATTEMPTS}: service active, health endpoint not ready yet"
            else
              echo "Attempt ${attempt}/${MAX_ATTEMPTS}: service state is '${state}'"
            fi

            sleep "$INTERVAL"
          done

          echo "::error::pm-app did not become healthy within $((MAX_ATTEMPTS * INTERVAL))s (last state: '${state}')"
          echo "--- systemctl status ---"
          sudo systemctl status pm-app --no-pager -l || true
          echo "--- last 50 journal lines ---"
          sudo journalctl -u pm-app -n 50 --no-pager || true
          exit 1
          REMOTE
