# Log retention policy (2026-09-30, agreed with the product owner): keep server logs for
# 90 days, at most 2 GB. Logs can hold customer details (e.g. email addresses) — keep less,
# for less time. Installed by deploy.sh to /etc/systemd/journald.conf.d/.
[Journal]
MaxRetentionSec=90day
SystemMaxUse=2G
